[package]
name = "dicom-jpeg-dicom"
description = "dicom-rs PixelDataReader / PixelDataWriter adapters for the dicom-jpeg codecs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["jpeg", "jpeg-ls", "jpeg2000", "htj2k", "jpeg-xl", "encode"]
jpeg = ["dep:dicom-jpeg-jpeg"]
jpeg-ls = ["dep:dicom-jpeg-jpegls"]
jpeg2000 = ["dep:dicom-jpeg-j2k"]
jpeg2000-part2 = ["jpeg2000", "dicom-jpeg-j2k/part2"]
htj2k = ["jpeg2000", "dicom-jpeg-j2k/htj2k"]
jpeg-xl = ["dep:dicom-jpeg-jxl"]
# Register the adapter in the dicom-rs transfer syntax registry.
inventory-registry = [
    "dicom-encoding/inventory-registry",
    "dep:dicom-transfer-syntax-registry",
    "dicom-transfer-syntax-registry/inventory-registry",
]
encode = [
    "dicom-jpeg-jpeg?/encode",
    "dicom-jpeg-jpegls?/encode",
    "dicom-jpeg-j2k?/encode",
    "dicom-jpeg-jxl?/encode",
]

[dependencies]
dicom-jpeg-common.workspace = true
dicom-jpeg-jpeg = { workspace = true, optional = true }
dicom-jpeg-jpegls = { workspace = true, optional = true }
dicom-jpeg-j2k = { workspace = true, optional = true }
dicom-jpeg-jxl = { workspace = true, optional = true }
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-encoding.workspace = true
dicom-transfer-syntax-registry = { version = "0.10.1", default-features = false, optional = true }

[lints]
workspace = true
