[package]
name = "dicom-jpeg"
description = "Pure-Rust JPEG-family codecs (JPEG, JPEG-LS, JPEG 2000, HTJ2K, JPEG XL) covering all active DICOM transfer syntaxes"
keywords = ["dicom", "jpeg", "jpeg2000", "jpeg-ls", "jpeg-xl"]
categories = ["compression", "multimedia::images"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["jpeg", "jpeg-ls", "jpeg2000", "htj2k", "jpeg-xl", "encode", "dicom"]
# ITU-T T.81: 1.2.840.10008.1.2.4.50 / .51 / .57 / .70
jpeg = ["dep:dicom-jpeg-jpeg", "dicom-jpeg-dicom?/jpeg"]
# ITU-T T.87: .80 / .81
jpeg-ls = ["dep:dicom-jpeg-jpegls", "dicom-jpeg-dicom?/jpeg-ls"]
# ISO/IEC 15444-1: .90 / .91
jpeg2000 = ["dep:dicom-jpeg-j2k", "dicom-jpeg-dicom?/jpeg2000"]
# ISO/IEC 15444-2 multi-component transforms: .92 / .93
jpeg2000-part2 = ["jpeg2000", "dicom-jpeg-j2k/part2", "dicom-jpeg-dicom?/jpeg2000-part2"]
# ISO/IEC 15444-15 High-Throughput JPEG 2000: .201 / .202 / .203
htj2k = ["jpeg2000", "dicom-jpeg-j2k/htj2k", "dicom-jpeg-dicom?/htj2k"]
# ISO/IEC 18181: .110 / .112 (.111 JPEG recompression additionally needs "jpeg")
jpeg-xl = ["dep:dicom-jpeg-jxl", "dicom-jpeg-dicom?/jpeg-xl"]
# Enable encoders (decoders are always available for enabled codecs)
encode = [
    "dicom-jpeg-jpeg?/encode",
    "dicom-jpeg-jpegls?/encode",
    "dicom-jpeg-j2k?/encode",
    "dicom-jpeg-jxl?/encode",
    "dicom-jpeg-dicom?/encode",
]
# dicom-rs PixelDataReader / PixelDataWriter adapters
dicom = ["dep:dicom-jpeg-dicom"]
# Register the dicom-rs adapter in the dicom-rs transfer syntax registry.
inventory-registry = ["dicom", "dicom-jpeg-dicom/inventory-registry"]

[dependencies]
dicom-jpeg-common.workspace = true
dicom-jpeg-jpeg = { workspace = true, optional = true }
dicom-jpeg-jpegls = { workspace = true, optional = true }
dicom-jpeg-j2k = { workspace = true, optional = true }
dicom-jpeg-jxl = { workspace = true, optional = true }
dicom-jpeg-dicom = { workspace = true, optional = true }

[dev-dependencies]
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-encoding.workspace = true
dicom-object = "0.10.1"
# Without dicom-rs's own codecs, so the registry tests see only dicom-jpeg.
dicom-pixeldata = { version = "0.10.1", default-features = false, features = ["image"] }
dicom-transfer-syntax-registry = { version = "0.10.1", default-features = false }
jpeg-decoder = "0.3"
jxl-oxide = { version = "0.12", default-features = false }
png = "0.18"

[[test]]
name = "dicom_decode"
required-features = ["dicom"]

[[test]]
name = "dicom_registry"
required-features = ["inventory-registry"]

[[test]]
name = "dicom_roundtrip"
required-features = ["dicom", "encode"]

[lints]
workspace = true

[[test]]
name = "dicom_harness"
required-features = ["dicom"]

[[test]]
name = "jpeg_conformance"
required-features = ["jpeg", "dicom"]

[[test]]
name = "jpeg_encoder"
required-features = ["jpeg", "encode"]

[[example]]
name = "decode"
required-features = ["dicom"]

[[example]]
name = "dicom_rs"
required-features = ["inventory-registry"]

[[test]]
name = "jpegls_conformance"
required-features = ["jpeg-ls", "dicom"]

[[test]]
name = "jpegls_encoder"
required-features = ["jpeg-ls", "encode"]

[[example]]
name = "compare_toimage"
required-features = ["dicom"]

[[test]]
name = "j2k_conformance"
required-features = ["jpeg2000", "dicom"]

[[test]]
name = "j2k_encoder"
required-features = ["jpeg2000", "encode"]

[[test]]
name = "jxl_conformance"
required-features = ["jpeg-xl"]

[[test]]
name = "jxl_encoder"
required-features = ["jpeg-xl", "encode"]
