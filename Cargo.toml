[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/feliwir/dicom-jpeg"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
dicom-jpeg-common = { path = "crates/common", version = "0.1.0" }
dicom-jpeg-jpeg = { path = "crates/jpeg", version = "0.1.0", default-features = false }
dicom-jpeg-jpegls = { path = "crates/jpegls", version = "0.1.0", default-features = false }
dicom-jpeg-j2k = { path = "crates/j2k", version = "0.1.0", default-features = false }
dicom-jpeg-jxl = { path = "crates/jxl", version = "0.1.0", default-features = false }

[package]
name = "dicom-jpeg"
description = "Pure-Rust JPEG-family codecs (JPEG, JPEG-LS, JPEG 2000, HTJ2K, JPEG XL) covering all active DICOM transfer syntaxes"
keywords = ["dicom", "jpeg", "jpeg2000", "jpeg-ls", "jpeg-xl"]
categories = ["compression", "multimedia::images"]
exclude = ["testdata/", "fuzz/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["jpeg", "jpeg-ls", "jpeg2000", "htj2k", "jpeg-xl", "encode", "dicom"]
# ITU-T T.81: 1.2.840.10008.1.2.4.50 / .51 / .57 / .70
jpeg = ["dep:dicom-jpeg-jpeg"]
# ITU-T T.87: .80 / .81
jpeg-ls = ["dep:dicom-jpeg-jpegls"]
# ISO/IEC 15444-1: .90 / .91
jpeg2000 = ["dep:dicom-jpeg-j2k"]
# ISO/IEC 15444-2 multi-component transforms: .92 / .93
jpeg2000-part2 = ["jpeg2000", "dicom-jpeg-j2k/part2"]
# ISO/IEC 15444-15 High-Throughput JPEG 2000: .201 / .202 / .203
htj2k = ["jpeg2000", "dicom-jpeg-j2k/htj2k"]
# ISO/IEC 18181: .110 / .112 (.111 JPEG recompression additionally needs "jpeg")
jpeg-xl = ["dep:dicom-jpeg-jxl"]
# Enable encoders (decoders are always available for enabled codecs)
encode = [
    "dicom-jpeg-jpeg?/encode",
    "dicom-jpeg-jpegls?/encode",
    "dicom-jpeg-j2k?/encode",
    "dicom-jpeg-jxl?/encode",
]
# dicom-rs PixelDataReader / PixelDataWriter adapters
dicom = ["dep:dicom-encoding", "dep:dicom-core", "dep:dicom-dictionary-std"]
# Data parallelism (tiles, code-blocks, frames)
parallel = ["dep:rayon"]

[dependencies]
dicom-jpeg-common.workspace = true
dicom-jpeg-jpeg = { workspace = true, optional = true }
dicom-jpeg-jpegls = { workspace = true, optional = true }
dicom-jpeg-j2k = { workspace = true, optional = true }
dicom-jpeg-jxl = { workspace = true, optional = true }
dicom-core = { version = "0.10.1", optional = true }
dicom-dictionary-std = { version = "0.10.1", optional = true }
dicom-encoding = { version = "0.10.1", optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
dicom-core = "0.10.1"
dicom-dictionary-std = "0.10.1"
dicom-encoding = "0.10.1"
dicom-object = "0.10.1"
jpeg-decoder = "0.3"
jxl-oxide = { version = "0.12", default-features = false }
png = "0.18"

[[test]]
name = "dicom_decode"
required-features = ["dicom"]

[[test]]
name = "dicom_roundtrip"
required-features = ["dicom", "encode"]

[profile.test]
opt-level = 2

[lints]
workspace = true

[[test]]
name = "dicom_harness"
required-features = ["dicom"]

[[test]]
name = "jpeg_conformance"
required-features = ["jpeg", "dicom"]

[[test]]
name = "jpeg_encoder"
required-features = ["jpeg", "encode"]

[[example]]
name = "decode"
required-features = ["dicom"]

[[test]]
name = "jpegls_conformance"
required-features = ["jpeg-ls", "dicom"]

[[test]]
name = "jpegls_encoder"
required-features = ["jpeg-ls", "encode"]

[[example]]
name = "compare_toimage"
required-features = ["dicom"]

[[test]]
name = "j2k_conformance"
required-features = ["jpeg2000", "dicom"]

[[test]]
name = "j2k_encoder"
required-features = ["jpeg2000", "encode"]

[[test]]
name = "jxl_conformance"
required-features = ["jpeg-xl"]

[[test]]
name = "jxl_encoder"
required-features = ["jpeg-xl", "encode"]
