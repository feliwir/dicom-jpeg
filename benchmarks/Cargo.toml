[package]
name = "dicom-jpeg-benchmarks"
description = "Criterion benchmarks of dicom-jpeg against reference codec implementations"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The reference codecs need newer compilers than the library MSRV.
rust-version = "1.92"

[dependencies]
dicom-jpeg = { path = "../crates/dicom-jpeg", features = ["jpeg2000-part2"] }
dicom-jpeg-common.workspace = true
dicom-jpeg-jpeg = { workspace = true, features = ["kernels"] }
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-encoding.workspace = true
dicom-object = "0.10.1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }

# JPEG (T.81)
turbojpeg = "1.5"
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-decoder = { version = "0.3", default-features = false }
# JPEG-LS
charls = { version = "0.4", features = ["static"] }
# JPEG 2000 / HTJ2K
openjpeg-sys = "1.0"
openjp2 = { version = "0.7", default-features = false }
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "simd"] }
# JPEG XL
jpegxl-rs = { version = "0.16", default-features = false, features = ["vendored"] }
jxl-oxide = { version = "0.12", default-features = false }
jxl = "0.8"
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bench]]
name = "jpeg"
harness = false

[[bench]]
name = "jpegls"
harness = false

[[bench]]
name = "j2k"
harness = false

[[bench]]
name = "htj2k"
harness = false

[[bench]]
name = "jxl"
harness = false

[[bench]]
name = "kernels"
harness = false
